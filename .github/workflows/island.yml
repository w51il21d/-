name: Build Island APK
on:
  push:
    paths: ["island/**", ".github/workflows/island.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-build
          path: |
            island/app/build/outputs/apk/debug/*.apk
            island/app/build/reports/tests/
            island/app/build/qa/
      # APK goes on its own branch so the phone can download it with one link.
      - name: Publish APK branch
        run: |
          mkdir -p out/qa && cp app/build/outputs/apk/debug/app-debug.apk out/Island.apk
          cp app/build/qa/*.png out/qa/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b island-apk
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Island APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" island-apk
